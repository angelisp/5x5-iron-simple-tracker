name: Build Signed Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bootstrap Android Project & Sync Web Assets
        env:
          ANDROID_BUNDLE_GZ_B64: ""
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const zlib = require("zlib");
            const b64 = (process.env.ANDROID_BUNDLE_GZ_B64 || "").replace(/\s+/g, "");
            const jsonStr = zlib.gunzipSync(Buffer.from(b64, "base64")).toString("utf8");
            const files = JSON.parse(jsonStr);
            for (const [relPath, content] of Object.entries(files)) {
              fs.mkdirSync(path.dirname(relPath), { recursive: true });
              fs.writeFileSync(relPath, content, "utf8");
            }
            console.log("Bootstrapped " + Object.keys(files).length + " Android & Capacitor project files.");
          '
          npm install
          node scripts/copy-web.js

      - name: Prepare Release Keystore (from GitHub Secrets or Auto-Generated Fallback)
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using repository secret ANDROID_KEYSTORE_BASE64 for Play Store release signing..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
            printf "storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found. Generating a self-signed release keystore so APK/AAB is still signed..."
            rm -f app/release-keystore.jks
            keytool -genkeypair -v \
              -keystore app/release-keystore.jks \
              -alias iron5x5 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass iron5x5pass \
              -keypass iron5x5pass \
              -dname "CN=5x5 Iron Tracker, OU=Fitness, O=Iron5x5, L=London, S=London, C=GB"
            printf "storeFile=release-keystore.jks\nstorePassword=iron5x5pass\nkeyAlias=iron5x5\nkeyPassword=iron5x5pass\n" > keystore.properties
          fi

      - name: Build Signed Release APK & Play Store AAB with Gradle
        working-directory: ./android
        run: |
          gradle assembleRelease bundleRelease --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 5x5-iron-tracker-signed-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Signed Google Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: 5x5-iron-tracker-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
