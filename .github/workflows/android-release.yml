name: Build Signed Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bootstrap Android Project & Sync Web Assets
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const files = {
              "package.json": [
                "{",
                "  \"name\": \"5x5-iron-simple-tracker\",",
                "  \"version\": \"1.1.0\",",
                "  \"description\": \"Offline-first 5x5 progressive overload \u0026 custom workout strength tracker with Android Health Connect integration.\",",
                "  \"main\": \"www/index.html\",",
                "  \"scripts\": {",
                "    \"sync:web\": \"node scripts/copy-web.js\",",
                "    \"cap:sync\": \"npm run sync:web \u0026\u0026 npx cap sync android\",",
                "    \"cap:open\": \"npx cap open android\",",
                "    \"android:debug\": \"npm run cap:sync \u0026\u0026 cd android \u0026\u0026 ./gradlew assembleDebug\",",
                "    \"android:release-apk\": \"npm run cap:sync \u0026\u0026 cd android \u0026\u0026 ./gradlew assembleRelease\",",
                "    \"android:release-aab\": \"npm run cap:sync \u0026\u0026 cd android \u0026\u0026 ./gradlew bundleRelease\"",
                "  },",
                "  \"dependencies\": {",
                "    \"@capacitor/android\": \"^6.1.2\",",
                "    \"@capacitor/core\": \"^6.1.2\"",
                "  },",
                "  \"devDependencies\": {",
                "    \"@capacitor/cli\": \"^6.1.2\"",
                "  },",
                "  \"author\": \"\",",
                "  \"license\": \"MIT\"",
                "}",
                "",
              ].join("\n"),
              "capacitor.config.json": [
                "{",
                "  \"appId\": \"com.iron5x5.tracker\",",
                "  \"appName\": \"5x5 Iron Tracker\",",
                "  \"webDir\": \"www\",",
                "  \"server\": {",
                "    \"androidScheme\": \"https\"",
                "  }",
                "}",
                "",
              ].join("\n"),
              "scripts/copy-web.js": [
                "const fs = require(\u0027fs\u0027);",
                "const path = require(\u0027path\u0027);",
                "",
                "const rootDir = path.resolve(__dirname, \u0027..\u0027);",
                "const wwwDir = path.join(rootDir, \u0027www\u0027);",
                "const androidAssetsDir = path.join(rootDir, \u0027android\u0027, \u0027app\u0027, \u0027src\u0027, \u0027main\u0027, \u0027assets\u0027);",
                "const androidPublicDir = path.join(androidAssetsDir, \u0027public\u0027);",
                "",
                "// Clean and recreate www/ and android assets/public/ so no stale files (like kofi-qr.png) remain in the Play Store build",
                "if (fs.existsSync(wwwDir)) {",
                "  fs.rmSync(wwwDir, { recursive: true, force: true });",
                "}",
                "fs.mkdirSync(wwwDir, { recursive: true });",
                "fs.mkdirSync(androidPublicDir, { recursive: true });",
                "",
                "// 1. Transform index.html for the Play Store release channel:",
                "//    - Inject window.APP_DISTRIBUTION_CHANNEL = \u0027PLAY_STORE\u0027",
                "//    - Strip Ko-fi URLs and QR image references so Google Play static scanners see zero external payment links",
                "const indexSrcPath = path.join(rootDir, \u0027index.html\u0027);",
                "if (fs.existsSync(indexSrcPath)) {",
                "  let html = fs.readFileSync(indexSrcPath, \u0027utf8\u0027);",
                "  html = html.replace(",
                "    \u0027\u003chead\u003e\u0027,",
                "    \u0027\u003chead\u003e\\n  \u003cscript\u003ewindow.APP_DISTRIBUTION_CHANNEL = \"PLAY_STORE\";\u003c/script\u003e\u0027",
                "  );",
                "  html = html.replace(/https:\\/\\/ko-fi\\.com\\/F5K229QP0X/g, \u0027\u0027);",
                "  html = html.replace(/https:\\/\\/ko-fi\\.com\\/img\\/githubbutton_sm\\.svg/g, \u0027\u0027);",
                "  html = html.replace(/\\.\\/kofi-qr\\.png/g, \u0027\u0027);",
                "  fs.writeFileSync(path.join(wwwDir, \u0027index.html\u0027), html, \u0027utf8\u0027);",
                "  fs.writeFileSync(path.join(androidPublicDir, \u0027index.html\u0027), html, \u0027utf8\u0027);",
                "  console.log(\u0027Prepared Play Store compliant index.html in www/ and android/app/src/main/assets/public/\u0027);",
                "}",
                "",
                "// 2. Copy manifest.json",
                "const manifestSrcPath = path.join(rootDir, \u0027manifest.json\u0027);",
                "if (fs.existsSync(manifestSrcPath)) {",
                "  fs.copyFileSync(manifestSrcPath, path.join(wwwDir, \u0027manifest.json\u0027));",
                "  fs.copyFileSync(manifestSrcPath, path.join(androidPublicDir, \u0027manifest.json\u0027));",
                "  console.log(\u0027Copied manifest.json -\u003e www/ and android assets\u0027);",
                "}",
                "",
                "// 3. Copy sw.js (without kofi-qr.png for Play Store build)",
                "const swSrcPath = path.join(rootDir, \u0027sw.js\u0027);",
                "if (fs.existsSync(swSrcPath)) {",
                "  let sw = fs.readFileSync(swSrcPath, \u0027utf8\u0027);",
                "  sw = sw.replace(/\\s*\u0027\\.\\/kofi-qr\\.png\u0027,?/g, \u0027\u0027);",
                "  fs.writeFileSync(path.join(wwwDir, \u0027sw.js\u0027), sw, \u0027utf8\u0027);",
                "  fs.writeFileSync(path.join(androidPublicDir, \u0027sw.js\u0027), sw, \u0027utf8\u0027);",
                "  console.log(\u0027Prepared sw.js -\u003e www/ and android assets\u0027);",
                "}",
                "",
                "// 4. Write Capacitor runtime config files into android/app/src/main/assets/",
                "const capConfig = {",
                "  appId: \u0027com.iron5x5.tracker\u0027,",
                "  appName: \u00275x5 Iron Tracker\u0027,",
                "  webDir: \u0027www\u0027,",
                "  server: {",
                "    androidScheme: \u0027https\u0027",
                "  }",
                "};",
                "fs.writeFileSync(",
                "  path.join(androidAssetsDir, \u0027capacitor.config.json\u0027),",
                "  JSON.stringify(capConfig, null, 2),",
                "  \u0027utf8\u0027",
                ");",
                "fs.writeFileSync(",
                "  path.join(androidAssetsDir, \u0027capacitor.plugins.json\u0027),",
                "  \u0027[]\u0027,",
                "  \u0027utf8\u0027",
                ");",
                "console.log(\u0027Wrote Capacitor Android asset configurations.\u0027);",
                "",
              ].join("\n"),
              "android/build.gradle": [
                "// Top-level build file where you can add configuration options common to all sub-projects/modules.",
                "buildscript {",
                "    ext {",
                "        minSdkVersion = 26",
                "        compileSdkVersion = 34",
                "        targetSdkVersion = 34",
                "        androidxActivityVersion = \u00271.9.2\u0027",
                "        androidxAppCompatVersion = \u00271.7.0\u0027",
                "        androidxCoordinatorLayoutVersion = \u00271.2.0\u0027",
                "        androidxCoreVersion = \u00271.13.1\u0027",
                "        androidxFragmentVersion = \u00271.8.3\u0027",
                "        coreSplashScreenVersion = \u00271.0.1\u0027",
                "        androidxWebkitVersion = \u00271.11.0\u0027",
                "        junitVersion = \u00274.13.2\u0027",
                "        androidxJunitVersion = \u00271.2.1\u0027",
                "        androidxEspressoCoreVersion = \u00273.6.1\u0027",
                "        cordovaAndroidVersion = \u002710.1.1\u0027",
                "        kotlin_version = \u00271.9.24\u0027",
                "    }",
                "    repositories {",
                "        google()",
                "        mavenCentral()",
                "    }",
                "    dependencies {",
                "        classpath \u0027com.android.tools.build:gradle:8.5.2\u0027",
                "        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version\"",
                "    }",
                "}",
                "",
                "allprojects {",
                "    repositories {",
                "        google()",
                "        mavenCentral()",
                "    }",
                "}",
                "",
                "task clean(type: Delete) {",
                "    delete rootProject.buildDir",
                "}",
                "",
              ].join("\n"),
              "android/settings.gradle": [
                "include \u0027:capacitor-android\u0027",
                "project(\u0027:capacitor-android\u0027).projectDir = new File(\u0027../node_modules/@capacitor/android/capacitor\u0027)",
                "",
                "include \u0027:app\u0027",
                "",
              ].join("\n"),
              "android/gradle.properties": [
                "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8",
                "android.useAndroidX=true",
                "android.enableJetifier=true",
                "kotlin.code.style=official",
                "",
              ].join("\n"),
              "android/app/build.gradle": [
                "plugins {",
                "    id \u0027com.android.application\u0027",
                "    id \u0027org.jetbrains.kotlin.android\u0027",
                "}",
                "",
                "def keystorePropsFile = rootProject.file(\"keystore.properties\")",
                "def keystoreProps = new Properties()",
                "if (keystorePropsFile.exists()) {",
                "    keystoreProps.load(new FileInputStream(keystorePropsFile))",
                "}",
                "",
                "android {",
                "    namespace \"com.iron5x5.tracker\"",
                "    compileSdk rootProject.ext.compileSdkVersion",
                "",
                "    defaultConfig {",
                "        applicationId \"com.iron5x5.tracker\"",
                "        minSdkVersion rootProject.ext.minSdkVersion",
                "        targetSdkVersion rootProject.ext.targetSdkVersion",
                "        versionCode 2",
                "        versionName \"1.1.0\"",
                "        testInstrumentationRunner \"androidx.test.runner.AndroidJUnitRunner\"",
                "        aaptOptions {",
                "            ignoreAssetsPattern \u0027!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~\u0027",
                "        }",
                "    }",
                "",
                "    signingConfigs {",
                "        release {",
                "            if (keystorePropsFile.exists()) {",
                "                storeFile file(keystoreProps.getProperty(\"storeFile\", \"release-keystore.jks\"))",
                "                storePassword keystoreProps.getProperty(\"storePassword\", \"\")",
                "                keyAlias keystoreProps.getProperty(\"keyAlias\", \"iron5x5\")",
                "                keyPassword keystoreProps.getProperty(\"keyPassword\", \"\")",
                "            } else if (System.getenv(\"SIGNING_STORE_FILE\")) {",
                "                storeFile file(System.getenv(\"SIGNING_STORE_FILE\"))",
                "                storePassword System.getenv(\"SIGNING_STORE_PASSWORD\")",
                "                keyAlias System.getenv(\"SIGNING_KEY_ALIAS\")",
                "                keyPassword System.getenv(\"SIGNING_KEY_PASSWORD\")",
                "            }",
                "        }",
                "    }",
                "",
                "    buildTypes {",
                "        release {",
                "            minifyEnabled false",
                "            shrinkResources false",
                "            proguardFiles getDefaultProguardFile(\u0027proguard-android-optimize.txt\u0027), \u0027proguard-rules.pro\u0027",
                "            if (keystorePropsFile.exists() || System.getenv(\"SIGNING_STORE_FILE\")) {",
                "                signingConfig signingConfigs.release",
                "            }",
                "        }",
                "        debug {",
                "            applicationIdSuffix \".debug\"",
                "            debuggable true",
                "        }",
                "    }",
                "",
                "    compileOptions {",
                "        sourceCompatibility JavaVersion.VERSION_17",
                "        targetCompatibility JavaVersion.VERSION_17",
                "    }",
                "    kotlinOptions {",
                "        jvmTarget = \u002717\u0027",
                "    }",
                "}",
                "",
                "dependencies {",
                "    implementation fileTree(include: [\u0027*.jar\u0027], dir: \u0027libs\u0027)",
                "    implementation \"androidx.appcompat:appcompat:$androidxAppCompatVersion\"",
                "    implementation \"androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion\"",
                "    implementation \"androidx.core:core-splashscreen:$coreSplashScreenVersion\"",
                "    implementation project(\u0027:capacitor-android\u0027)",
                "",
                "    // Android Health Connect Jetpack SDK",
                "    implementation \"androidx.health.connect:connect-client:1.1.0-alpha07\"",
                "    // Google Play In-App Billing SDK (for Google Play Tip Jar)",
                "    implementation \"com.android.billingclient:billing-ktx:7.1.1\"",
                "    implementation \"org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1\"",
                "",
                "    testImplementation \"junit:junit:$junitVersion\"",
                "    androidTestImplementation \"androidx.test.ext:junit:$androidxJunitVersion\"",
                "    androidTestImplementation \"androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion\"",
                "}",
                "",
              ].join("\n"),
              "android/app/proguard-rules.pro": [
                "# Add project specific ProGuard rules here.",
                "-keep class com.iron5x5.tracker.** { *; }",
                "-keepclassmembers class com.iron5x5.tracker.HealthConnectBridge {",
                "    @android.webkit.JavascriptInterface \u003cmethods\u003e;",
                "}",
                "-keepclassmembers class com.iron5x5.tracker.PlayBillingBridge {",
                "    @android.webkit.JavascriptInterface \u003cmethods\u003e;",
                "}",
                "-keep class com.getcapacitor.** { *; }",
                "-keep class com.android.vending.billing.** { *; }",
                "",
              ].join("\n"),
              "android/app/src/main/AndroidManifest.xml": [
                "\u003c?xml version=\"1.0\" encoding=\"utf-8\"?\u003e",
                "\u003cmanifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\u003e",
                "",
                "    \u003c!-- Health Connect Permissions for writing \u0026 reading Strength Training Workouts \u0026 Active Calories --\u003e",
                "    \u003cuses-permission android:name=\"android.permission.health.READ_EXERCISE\" /\u003e",
                "    \u003cuses-permission android:name=\"android.permission.health.WRITE_EXERCISE\" /\u003e",
                "    \u003cuses-permission android:name=\"android.permission.health.READ_ACTIVE_CALORIES_BURNED\" /\u003e",
                "    \u003cuses-permission android:name=\"android.permission.health.WRITE_ACTIVE_CALORIES_BURNED\" /\u003e",
                "    \u003cuses-permission android:name=\"android.permission.health.READ_TOTAL_CALORIES_BURNED\" /\u003e",
                "    \u003cuses-permission android:name=\"android.permission.health.WRITE_TOTAL_CALORIES_BURNED\" /\u003e",
                "    \u003cuses-permission android:name=\"com.android.vending.BILLING\" /\u003e",
                "    \u003cuses-permission android:name=\"android.permission.INTERNET\" /\u003e",
                "",
                "    \u003c!-- Required on Android 11+ (API 30+) to check Health Connect APK availability --\u003e",
                "    \u003cqueries\u003e",
                "        \u003cpackage android:name=\"com.google.android.apps.healthdata\" /\u003e",
                "        \u003cintent\u003e",
                "            \u003caction android:name=\"androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE\" /\u003e",
                "        \u003c/intent\u003e",
                "    \u003c/queries\u003e",
                "",
                "    \u003capplication",
                "        android:allowBackup=\"true\"",
                "        android:label=\"5x5 Iron Tracker\"",
                "        android:supportsRtl=\"true\"",
                "        android:theme=\"@style/Theme.AppCompat.NoActionBar\"",
                "        android:usesCleartextTraffic=\"true\"\u003e",
                "",
                "        \u003cactivity",
                "            android:name=\".MainActivity\"",
                "            android:configChanges=\"orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode\"",
                "            android:exported=\"true\"",
                "            android:launchMode=\"singleTask\"",
                "            android:screenOrientation=\"portrait\"\u003e",
                "",
                "            \u003cintent-filter\u003e",
                "                \u003caction android:name=\"android.intent.action.MAIN\" /\u003e",
                "                \u003ccategory android:name=\"android.intent.category.LAUNCHER\" /\u003e",
                "            \u003c/intent-filter\u003e",
                "",
                "            \u003c!-- Health Connect Privacy Policy / Rationale Intent Filter (Android 13 and below) --\u003e",
                "            \u003cintent-filter\u003e",
                "                \u003caction android:name=\"androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE\" /\u003e",
                "            \u003c/intent-filter\u003e",
                "        \u003c/activity\u003e",
                "",
                "        \u003c!-- Health Connect Privacy Policy Activity-Alias required for Android 14+ (API 34+) --\u003e",
                "        \u003cactivity-alias",
                "            android:name=\"ViewPermissionUsageActivity\"",
                "            android:exported=\"true\"",
                "            android:targetActivity=\".MainActivity\"",
                "            android:permission=\"android.permission.START_VIEW_PERMISSION_USAGE\"\u003e",
                "            \u003cintent-filter\u003e",
                "                \u003caction android:name=\"android.intent.action.VIEW_PERMISSION_USAGE\" /\u003e",
                "                \u003ccategory android:name=\"android.intent.category.HEALTH_PERMISSIONS\" /\u003e",
                "            \u003c/intent-filter\u003e",
                "        \u003c/activity-alias\u003e",
                "",
                "    \u003c/application\u003e",
                "\u003c/manifest\u003e",
                "",
              ].join("\n"),
              "android/app/src/main/res/values/strings.xml": [
                "\u003c?xml version=\"1.0\" encoding=\"utf-8\"?\u003e",
                "\u003cresources\u003e",
                "    \u003cstring name=\"app_name\"\u003e5x5 Iron Tracker\u003c/string\u003e",
                "    \u003cstring name=\"title_activity_main\"\u003e5x5 Iron Tracker\u003c/string\u003e",
                "    \u003cstring name=\"package_name\"\u003ecom.iron5x5.tracker\u003c/string\u003e",
                "    \u003cstring name=\"custom_url_scheme\"\u003ecom.iron5x5.tracker\u003c/string\u003e",
                "\u003c/resources\u003e",
                "",
              ].join("\n"),
              "android/app/src/main/res/xml/config.xml": [
                "\u003c?xml version=\"1.0\" encoding=\"utf-8\"?\u003e",
                "\u003cwidget version=\"1.1.0\" xmlns=\"http://www.w3.org/ns/widgets\" xmlns:cdv=\"http://cordova.apache.org/ns/1.0\"\u003e",
                "    \u003caccess origin=\"*\" /\u003e",
                "\u003c/widget\u003e",
                "",
              ].join("\n"),
              "android/app/src/main/java/com/iron5x5/tracker/MainActivity.kt": [
                "package com.iron5x5.tracker",
                "",
                "import android.os.Bundle",
                "import androidx.activity.result.ActivityResultLauncher",
                "import androidx.health.connect.client.PermissionController",
                "import com.getcapacitor.BridgeActivity",
                "",
                "class MainActivity : BridgeActivity() {",
                "",
                "    lateinit var healthConnectBridge: HealthConnectBridge",
                "    lateinit var playBillingBridge: PlayBillingBridge",
                "    lateinit var requestPermissionLauncher: ActivityResultLauncher\u003cSet\u003cString\u003e\u003e",
                "",
                "    override fun onCreate(savedInstanceState: Bundle?) {",
                "        // Register Health Connect permission launcher before super.onCreate",
                "        val requestPermissionActivityContract = PermissionController.createRequestPermissionResultContract()",
                "        requestPermissionLauncher = registerForActivityResult(requestPermissionActivityContract) { granted -\u003e",
                "            if (::healthConnectBridge.isInitialized) {",
                "                healthConnectBridge.onPermissionsResult(granted)",
                "            }",
                "        }",
                "",
                "        super.onCreate(savedInstanceState)",
                "",
                "        // Attach JavascriptInterfaces (\"AndroidHealthConnect\" \u0026 \"AndroidBilling\") to Capacitor\u0027s WebView",
                "        val webView = bridge?.webView",
                "        if (webView != null) {",
                "            healthConnectBridge = HealthConnectBridge(this, webView, requestPermissionLauncher)",
                "            playBillingBridge = PlayBillingBridge(this, webView)",
                "            webView.addJavascriptInterface(healthConnectBridge, \"AndroidHealthConnect\")",
                "            webView.addJavascriptInterface(playBillingBridge, \"AndroidBilling\")",
                "        }",
                "    }",
                "}",
                "",
              ].join("\n"),
              "android/app/src/main/java/com/iron5x5/tracker/HealthConnectBridge.kt": [
                "package com.iron5x5.tracker",
                "",
                "import android.webkit.JavascriptInterface",
                "import android.webkit.WebView",
                "import androidx.activity.result.ActivityResultLauncher",
                "import androidx.health.connect.client.HealthConnectClient",
                "import androidx.health.connect.client.permission.HealthPermission",
                "import androidx.health.connect.client.records.ActiveCaloriesBurnedRecord",
                "import androidx.health.connect.client.records.ExerciseSessionRecord",
                "import androidx.health.connect.client.records.TotalCaloriesBurnedRecord",
                "import androidx.health.connect.client.units.Energy",
                "import kotlinx.coroutines.CoroutineScope",
                "import kotlinx.coroutines.Dispatchers",
                "import kotlinx.coroutines.launch",
                "import org.json.JSONObject",
                "import java.time.Instant",
                "import java.time.ZoneOffset",
                "",
                "class HealthConnectBridge(",
                "    private val activity: MainActivity,",
                "    private val webView: WebView,",
                "    private val permissionLauncher: ActivityResultLauncher\u003cSet\u003cString\u003e\u003e",
                ") {",
                "    private val scope = CoroutineScope(Dispatchers.Main)",
                "",
                "    val permissions = setOf(",
                "        HealthPermission.getReadPermission(ExerciseSessionRecord::class),",
                "        HealthPermission.getWritePermission(ExerciseSessionRecord::class),",
                "        HealthPermission.getReadPermission(ActiveCaloriesBurnedRecord::class),",
                "        HealthPermission.getWritePermission(ActiveCaloriesBurnedRecord::class),",
                "        HealthPermission.getReadPermission(TotalCaloriesBurnedRecord::class),",
                "        HealthPermission.getWritePermission(TotalCaloriesBurnedRecord::class)",
                "    )",
                "",
                "    @JavascriptInterface",
                "    fun checkAvailability(): String {",
                "        val status = HealthConnectClient.getSdkStatus(activity)",
                "        val statusString = when (status) {",
                "            HealthConnectClient.SDK_AVAILABLE -\u003e \"AVAILABLE\"",
                "            HealthConnectClient.SDK_UNAVAILABLE_PROVIDER_UPDATE_REQUIRED -\u003e \"UPDATE_REQUIRED\"",
                "            else -\u003e \"UNAVAILABLE\"",
                "        }",
                "        val res = JSONObject()",
                "        res.put(\"status\", statusString)",
                "        res.put(\"code\", status)",
                "        return res.toString()",
                "    }",
                "",
                "    @JavascriptInterface",
                "    fun requestPermissions() {",
                "        val status = HealthConnectClient.getSdkStatus(activity)",
                "        if (status != HealthConnectClient.SDK_AVAILABLE) {",
                "            sendEventToJs(\"onHealthConnectPermissionResult\", \"{\\\"granted\\\":false,\\\"reason\\\":\\\"SDK_NOT_AVAILABLE\\\"}\")",
                "            return",
                "        }",
                "        scope.launch {",
                "            try {",
                "                val client = HealthConnectClient.getOrCreate(activity)",
                "                val granted = client.permissionController.getGrantedPermissions()",
                "                if (granted.containsAll(permissions)) {",
                "                    sendEventToJs(\"onHealthConnectPermissionResult\", \"{\\\"granted\\\":true}\")",
                "                } else {",
                "                    permissionLauncher.launch(permissions)",
                "                }",
                "            } catch (e: Exception) {",
                "                val err = JSONObject()",
                "                err.put(\"granted\", false)",
                "                err.put(\"error\", e.message ?: \"Unknown error\")",
                "                sendEventToJs(\"onHealthConnectPermissionResult\", err.toString())",
                "            }",
                "        }",
                "    }",
                "",
                "    fun onPermissionsResult(granted: Set\u003cString\u003e) {",
                "        val allGranted = granted.containsAll(permissions)",
                "        val obj = JSONObject()",
                "        obj.put(\"granted\", allGranted)",
                "        obj.put(\"grantedCount\", granted.size)",
                "        sendEventToJs(\"onHealthConnectPermissionResult\", obj.toString())",
                "    }",
                "",
                "    @JavascriptInterface",
                "    fun writeWorkoutSession(payloadJson: String) {",
                "        scope.launch(Dispatchers.IO) {",
                "            try {",
                "                val status = HealthConnectClient.getSdkStatus(activity)",
                "                if (status != HealthConnectClient.SDK_AVAILABLE) {",
                "                    sendEventToJs(\"onHealthConnectWriteResult\", \"{\\\"success\\\":false,\\\"error\\\":\\\"Health Connect SDK not available\\\"}\")",
                "                    return@launch",
                "                }",
                "",
                "                val json = JSONObject(payloadJson)",
                "                val title = json.optString(\"title\", \"5x5 Strength Training\")",
                "                val notes = json.optString(\"notes\", \"\")",
                "                val startEpochMs = json.optLong(\"startTimeMs\", System.currentTimeMillis() - 2700_000L)",
                "                val endEpochMs = json.optLong(\"endTimeMs\", System.currentTimeMillis())",
                "                val activeKcal = json.optDouble(\"activeCaloriesKcal\", 220.0)",
                "                val totalSets = json.optInt(\"totalSets\", 15)",
                "",
                "                val startTime = Instant.ofEpochMilli(startEpochMs)",
                "                val endTime = Instant.ofEpochMilli(endEpochMs.coerceAtLeast(startEpochMs + 60_000L))",
                "                val zoneOffset = ZoneOffset.systemDefault().rules.getOffset(startTime)",
                "",
                "                val exerciseRecord = ExerciseSessionRecord(",
                "                    startTime = startTime,",
                "                    startZoneOffset = zoneOffset,",
                "                    endTime = endTime,",
                "                    endZoneOffset = zoneOffset,",
                "                    exerciseType = ExerciseSessionRecord.EXERCISE_TYPE_STRENGTH_TRAINING,",
                "                    title = title,",
                "                    notes = notes",
                "                )",
                "",
                "                val caloriesRecord = ActiveCaloriesBurnedRecord(",
                "                    startTime = startTime,",
                "                    startZoneOffset = zoneOffset,",
                "                    endTime = endTime,",
                "                    endZoneOffset = zoneOffset,",
                "                    energy = Energy.kilocalories(activeKcal)",
                "                )",
                "",
                "                val client = HealthConnectClient.getOrCreate(activity)",
                "                val response = client.insertRecords(listOf(exerciseRecord, caloriesRecord))",
                "",
                "                val out = JSONObject()",
                "                out.put(\"success\", true)",
                "                out.put(\"recordIds\", response.recordIdsList.joinToString(\",\"))",
                "                out.put(\"title\", title)",
                "                out.put(\"activeCaloriesKcal\", activeKcal)",
                "                out.put(\"totalSets\", totalSets)",
                "                sendEventToJs(\"onHealthConnectWriteResult\", out.toString())",
                "            } catch (e: Exception) {",
                "                val out = JSONObject()",
                "                out.put(\"success\", false)",
                "                out.put(\"error\", e.message ?: \"Failed to write to Health Connect\")",
                "                sendEventToJs(\"onHealthConnectWriteResult\", out.toString())",
                "            }",
                "        }",
                "    }",
                "",
                "    private fun sendEventToJs(callbackName: String, jsonPayload: String) {",
                "        activity.runOnUiThread {",
                "            val escaped = jsonPayload.replace(\"\\\\\", \"\\\\\\\\\").replace(\"\u0027\", \"\\\\\u0027\")",
                "            webView.evaluateJavascript(",
                "                \"window.$callbackName \u0026\u0026 window.$callbackName(JSON.parse(\u0027$escaped\u0027));\",",
                "                null",
                "            )",
                "        }",
                "    }",
                "}",
                "",
              ].join("\n"),
              "android/app/src/main/java/com/iron5x5/tracker/PlayBillingBridge.kt": [
                "package com.iron5x5.tracker",
                "",
                "import android.webkit.JavascriptInterface",
                "import android.webkit.WebView",
                "import com.android.billingclient.api.*",
                "import org.json.JSONArray",
                "import org.json.JSONObject",
                "",
                "class PlayBillingBridge(",
                "    private val activity: MainActivity,",
                "    private val webView: WebView",
                ") : PurchasesUpdatedListener {",
                "",
                "    private val tipProductIds = listOf(\"tip_coffee\", \"tip_shake\", \"tip_preworkout\")",
                "    private val productDetailsMap = mutableMapOf\u003cString, ProductDetails\u003e()",
                "",
                "    private val billingClient: BillingClient = BillingClient.newBuilder(activity)",
                "        .setListener(this)",
                "        .enablePendingPurchases(",
                "            PendingPurchasesParams.newBuilder().enableOneTimeProducts().build()",
                "        )",
                "        .build()",
                "",
                "    init {",
                "        startBillingConnection()",
                "    }",
                "",
                "    private fun startBillingConnection(onConnected: (() -\u003e Unit)? = null) {",
                "        if (billingClient.isReady) {",
                "            onConnected?.invoke()",
                "            return",
                "        }",
                "        billingClient.startConnection(object : BillingClientStateListener {",
                "            override fun onBillingSetupFinished(billingResult: BillingResult) {",
                "                if (billingResult.responseCode == BillingClient.BillingResponseCode.OK) {",
                "                    queryTipProducts()",
                "                    onConnected?.invoke()",
                "                }",
                "            }",
                "",
                "            override fun onBillingServiceDisconnected() {",
                "                // Will reconnect automatically on next user action",
                "            }",
                "        })",
                "    }",
                "",
                "    @JavascriptInterface",
                "    fun queryTipProducts() {",
                "        startBillingConnection {",
                "            val productList = tipProductIds.map { sku -\u003e",
                "                QueryProductDetailsParams.Product.newBuilder()",
                "                    .setProductId(sku)",
                "                    .setProductType(BillingClient.ProductType.INAPP)",
                "                    .build()",
                "            }",
                "            val params = QueryProductDetailsParams.newBuilder()",
                "                .setProductList(productList)",
                "                .build()",
                "",
                "            billingClient.queryProductDetailsAsync(params) { billingResult, productDetailsList -\u003e",
                "                if (billingResult.responseCode == BillingClient.BillingResponseCode.OK) {",
                "                    val arr = JSONArray()",
                "                    for (pd in productDetailsList) {",
                "                        productDetailsMap[pd.productId] = pd",
                "                        val item = JSONObject()",
                "                        item.put(\"productId\", pd.productId)",
                "                        item.put(\"title\", pd.title)",
                "                        item.put(\"name\", pd.name)",
                "                        item.put(\"description\", pd.description)",
                "                        item.put(\"formattedPrice\", pd.oneTimePurchaseOfferDetails?.formattedPrice ?: \"\")",
                "                        arr.put(item)",
                "                    }",
                "                    val payload = JSONObject()",
                "                    payload.put(\"success\", true)",
                "                    payload.put(\"products\", arr)",
                "                    sendEventToJs(\"onPlayBillingProductsLoaded\", payload.toString())",
                "                }",
                "            }",
                "        }",
                "    }",
                "",
                "    @JavascriptInterface",
                "    fun launchTipPurchase(productId: String) {",
                "        startBillingConnection {",
                "            val details = productDetailsMap[productId]",
                "            if (details == null) {",
                "                // Re-query and then launch if not cached yet",
                "                val productList = listOf(",
                "                    QueryProductDetailsParams.Product.newBuilder()",
                "                        .setProductId(productId)",
                "                        .setProductType(BillingClient.ProductType.INAPP)",
                "                        .build()",
                "                )",
                "                val params = QueryProductDetailsParams.newBuilder().setProductList(productList).build()",
                "                billingClient.queryProductDetailsAsync(params) { res, list -\u003e",
                "                    if (res.responseCode == BillingClient.BillingResponseCode.OK \u0026\u0026 list.isNotEmpty()) {",
                "                        val pd = list[0]",
                "                        productDetailsMap[pd.productId] = pd",
                "                        launchBillingFlowOnUiThread(pd)",
                "                    } else {",
                "                        val err = JSONObject()",
                "                        err.put(\"success\", false)",
                "                        err.put(\"productId\", productId)",
                "                        err.put(\"error\", \"Tip product \u0027$productId\u0027 not configured in Play Console yet.\")",
                "                        sendEventToJs(\"onPlayBillingPurchaseResult\", err.toString())",
                "                    }",
                "                }",
                "            } else {",
                "                launchBillingFlowOnUiThread(details)",
                "            }",
                "        }",
                "    }",
                "",
                "    private fun launchBillingFlowOnUiThread(productDetails: ProductDetails) {",
                "        activity.runOnUiThread {",
                "            val productDetailsParamsList = listOf(",
                "                BillingFlowParams.ProductDetailsParams.newBuilder()",
                "                    .setProductDetails(productDetails)",
                "                    .build()",
                "            )",
                "            val billingFlowParams = BillingFlowParams.newBuilder()",
                "                .setProductDetailsParamsList(productDetailsParamsList)",
                "                .build()",
                "            billingClient.launchBillingFlow(activity, billingFlowParams)",
                "        }",
                "    }",
                "",
                "    override fun onPurchasesUpdated(billingResult: BillingResult, purchases: MutableList\u003cPurchase\u003e?) {",
                "        if (billingResult.responseCode == BillingClient.BillingResponseCode.OK \u0026\u0026 purchases != null) {",
                "            for (purchase in purchases) {",
                "                handleConsumableTipPurchase(purchase)",
                "            }",
                "        } else if (billingResult.responseCode == BillingClient.BillingResponseCode.USER_CANCELED) {",
                "            val out = JSONObject()",
                "            out.put(\"success\", false)",
                "            out.put(\"canceled\", true)",
                "            sendEventToJs(\"onPlayBillingPurchaseResult\", out.toString())",
                "        } else {",
                "            val out = JSONObject()",
                "            out.put(\"success\", false)",
                "            out.put(\"error\", billingResult.debugMessage)",
                "            sendEventToJs(\"onPlayBillingPurchaseResult\", out.toString())",
                "        }",
                "    }",
                "",
                "    private fun handleConsumableTipPurchase(purchase: Purchase) {",
                "        if (purchase.purchaseState == Purchase.PurchaseState.PURCHASED) {",
                "            // Consume immediately so the user can tip again anytime in the future",
                "            val consumeParams = ConsumeParams.newBuilder()",
                "                .setPurchaseToken(purchase.purchaseToken)",
                "                .build()",
                "",
                "            billingClient.consumeAsync(consumeParams) { billingResult, _ -\u003e",
                "                val out = JSONObject()",
                "                out.put(\"success\", billingResult.responseCode == BillingClient.BillingResponseCode.OK)",
                "                out.put(\"productId\", purchase.products.firstOrNull() ?: \"tip\")",
                "                sendEventToJs(\"onPlayBillingPurchaseResult\", out.toString())",
                "            }",
                "        }",
                "    }",
                "",
                "    private fun sendEventToJs(callbackName: String, jsonPayload: String) {",
                "        activity.runOnUiThread {",
                "            val escaped = jsonPayload.replace(\"\\\\\", \"\\\\\\\\\").replace(\"\u0027\", \"\\\\\u0027\")",
                "            webView.evaluateJavascript(",
                "                \"window.$callbackName \u0026\u0026 window.$callbackName(JSON.parse(\u0027$escaped\u0027));\",",
                "                null",
                "            )",
                "        }",
                "    }",
                "}",
                "",
              ].join("\n"),
            };
            for (const [relPath, content] of Object.entries(files)) {
              fs.mkdirSync(path.dirname(relPath), { recursive: true });
              fs.writeFileSync(relPath, content, "utf8");
            }
            console.log("Bootstrapped " + Object.keys(files).length + " Android & Capacitor project files.");
          '
