      - name: Prepare Release Keystore (from GitHub Secrets or Auto-Generated Fallback)
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using repository secret ANDROID_KEYSTORE_BASE64 for Play Store release signing..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
            printf "storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found. Generating a self-signed release keystore so APK/AAB is still signed..."
            rm -f app/release-keystore.jks
            keytool -genkeypair -v \
              -keystore app/release-keystore.jks \
              -alias iron5x5 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass iron5x5pass \
              -keypass iron5x5pass \
              -dname "CN=5x5 Iron Tracker, OU=Fitness, O=Iron5x5, L=London, S=London, C=GB"
            printf "storeFile=release-keystore.jks\nstorePassword=iron5x5pass\nkeyAlias=iron5x5\nkeyPassword=iron5x5pass\n" > keystore.properties
          fi

      - name: Build Signed Release APK & Play Store AAB with Gradle
        working-directory: ./android
        run: |
          gradle assembleRelease bundleRelease --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 5x5-iron-tracker-signed-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Signed Google Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: 5x5-iron-tracker-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
